name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: AutoTest Setup
      id: autotest-setup
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: AutoTest Setup
        setup-command: git clone https://github.com/TeacherTalley/Stack_AutoTest.git
        command: cd Stack_AutoTest && ./AutoTest_setup.sh
        timeout: 10
        max-score: 0
    - name: Main Output
      id: main-output
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Main Output
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_OutputTest.sh Stack_AutoTest/build"
        timeout: 10
        max-score: 10
    - name: Coding Style
      id: coding-style
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Coding Style
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_Style.sh Stack_AutoTest main.cpp Stack.h Queue.h"
        timeout: 10
        max-score: 4
    - name: Stack Empty
      id: stack-empty
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Stack Empty
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh StackTest.Empty"
        timeout: 10
        max-score: 1
    - name: Stack Size
      id: stack-size
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Stack Size
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh StackTest.Size"
        timeout: 10
        max-score: 1
    - name: Stack Top
      id: stack-top
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Stack Top
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh StackTest.Top"
        timeout: 10
        max-score: 5
    - name: Stack TopEmptyStack
      id: stack-topemptystack
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Stack TopEmptyStack
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh StackTest.TopEmptyStack"
        timeout: 10
        max-score: 5
    - name: Stack Push
      id: stack-push
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Stack Push
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh StackTest.Push"
        timeout: 10
        max-score: 10
    - name: Stack Pop
      id: stack-pop
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Stack Pop
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh StackTest.Pop"
        timeout: 10
        max-score: 10
    - name: Stack PopEmptyStack
      id: stack-popemptystack
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Stack PopEmptyStack
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh StackTest.PopEmptyStack"
        timeout: 10
        max-score: 5
    - name: Stack ToString
      id: stack-tostring
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Stack ToString
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh StackTest.ToString"
        timeout: 10
        max-score: 1
    - name: Stack Print
      id: stack-print
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Stack Print
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh StackTest.Print"
        timeout: 10
        max-score: 1
    - name: Stack CopyConstructor
      id: stack-copyconstructor
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Stack CopyConstructor
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh StackTest.CopyConstructor"
        timeout: 10
        max-score: 1
    - name: Stack SaveRestore
      id: stack-saverestore
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Stack SaveRestore
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh StackTest.SaveRestore"
        timeout: 10
        max-score: 3
    - name: Queue Empty
      id: queue-empty
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Queue Empty
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh QueueTest.Empty"
        timeout: 10
        max-score: 1
    - name: Queue Size
      id: queue-size
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Queue Size
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh QueueTest.Size"
        timeout: 10
        max-score: 1
    - name: Queue Front
      id: queue-front
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Queue Front
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh QueueTest.Front"
        timeout: 10
        max-score: 5
    - name: Queue FrontEmptyQueue
      id: queue-frontemptyqueue
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Queue FrontEmptyQueue
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh QueueTest.FrontEmptyQueue"
        timeout: 10
        max-score: 5
    - name: Queue Enqueue
      id: queue-enqueue
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Queue Enqueue
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh QueueTest.Enqueue"
        timeout: 10
        max-score: 10
    - name: Queue Dequeue
      id: queue-dequeue
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Queue Dequeue
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh QueueTest.Dequeue"
        timeout: 10
        max-score: 10
    - name: Queue DequeueEmptyQueue
      id: queue-dequeueemptyqueue
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Queue DequeueEmptyQueue
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh QueueTest.DequeueEmptyQueue"
        timeout: 10
        max-score: 5
    - name: Queue ToString
      id: queue-tostring
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Queue ToString
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh QueueTest.ToString"
        timeout: 10
        max-score: 1
    - name: Queue Print
      id: queue-print
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Queue Print
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh QueueTest.Print"
        timeout: 10
        max-score: 1
    - name: Queue CopyConstructor
      id: queue-copyconstructor
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Queue CopyConstructor
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh QueueTest.CopyConstructor"
        timeout: 10
        max-score: 1
    - name: Queue SaveRestore
      id: queue-saverestore
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Queue SaveRestore
        setup-command: ''
        command: "./Stack_AutoTest/AutoTest_gtest.sh QueueTest.SaveRestore"
        timeout: 10
        max-score: 3
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        AUTOTEST-SETUP_RESULTS: "${{steps.autotest-setup.outputs.result}}"
        CODING-STYLE_RESULTS: "${{steps.coding-style.outputs.result}}"
        MAIN-OUTPUT_RESULTS: "${{steps.main-output.outputs.result}}"
        STACK-EMPTY_RESULTS: "${{steps.stack-empty.outputs.result}}"
        STACK-SIZE_RESULTS: "${{steps.stack-size.outputs.result}}"
        STACK-TOP_RESULTS: "${{steps.stack-top.outputs.result}}"
        STACK-TOPEMPTYSTACK_RESULTS: "${{steps.stack-topemptystack.outputs.result}}"
        STACK-PUSH_RESULTS: "${{steps.stack-push.outputs.result}}"
        STACK-POP_RESULTS: "${{steps.stack-pop.outputs.result}}"
        STACK-POPEMPTYSTACK_RESULTS: "${{steps.stack-popemptystack.outputs.result}}"
        STACK-TOSTRING_RESULTS: "${{steps.stack-tostring.outputs.result}}"
        STACK-PRINT_RESULTS: "${{steps.stack-print.outputs.result}}"
        STACK-COPYCONSTRUCTOR_RESULTS: "${{steps.stack-copyconstructor.outputs.result}}"
        STACK-SAVERESTORE_RESULTS: "${{steps.stack-saverestore.outputs.result}}"
        QUEUE-EMPTY_RESULTS: "${{steps.queue-empty.outputs.result}}"
        QUEUE-SIZE_RESULTS: "${{steps.queue-size.outputs.result}}"
        QUEUE-FRONT_RESULTS: "${{steps.queue-front.outputs.result}}"
        QUEUE-FRONTEMPTYQUEUE_RESULTS: "${{steps.queue-frontemptyqueue.outputs.result}}"
        QUEUE-ENQUEUE_RESULTS: "${{steps.queue-enqueue.outputs.result}}"
        QUEUE-DEQUEUE_RESULTS: "${{steps.queue-dequeue.outputs.result}}"
        QUEUE-DEQUEUEEMPTYQUEUE_RESULTS: "${{steps.queue-dequeueemptyqueue.outputs.result}}"
        QUEUE-TOSTRING_RESULTS: "${{steps.queue-tostring.outputs.result}}"
        QUEUE-PRINT_RESULTS: "${{steps.queue-print.outputs.result}}"
        QUEUE-COPYCONSTRUCTOR_RESULTS: "${{steps.queue-copyconstructor.outputs.result}}"
        QUEUE-SAVERESTORE_RESULTS: "${{steps.queue-saverestore.outputs.result}}"
      with:
        runners: autotest-setup,coding-style,main-output,stack-empty,stack-size,stack-top,stack-topemptystack,stack-push,stack-pop,stack-popemptystack,stack-tostring,stack-print,stack-copyconstructor,stack-saverestore,queue-empty,queue-size,queue-front,queue-frontemptyqueue,queue-enqueue,queue-dequeue,queue-dequeueemptyqueue,queue-tostring,queue-print,queue-copyconstructor,queue-saverestore
